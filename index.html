<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn nước</title>
<meta name="theme-color" content="#FFD6E4">
<meta name="description" content="Chân ái, tạm được hay lốp dự phòng? Vào chọn nước đi mấy đứa.">
<meta property="og:type" content="website">
<meta property="og:locale" content="vi_VN">
<meta property="og:site_name" content="Chọn nước">
<meta property="og:url" content="https://lela.izcuyt.com/">
<meta property="og:title" content="Hôm nay tớ muốn...">
<meta property="og:description" content="Chân ái, tạm được hay lốp dự phòng? Vào chọn nước đi mấy đứa.">
<meta property="og:image" content="https://lela.izcuyt.com/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ly nước hoạt hình dễ thương trên nền hồng pastel">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header>
    <p class="date" id="date"></p>
    <h1>Hôm nay tớ muốn...</h1>
  </header>

  <p class="banner" id="banner" role="status" hidden></p>

  <div class="top-row">
    <button type="button" class="pill" id="whoBtn">Tớ là: ...</button>
    <button type="button" class="pill pill-menu" id="menuBtn">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v15c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v15"/></svg>
      Xem menu
    </button>
  </div>

  <div class="tiers">
    <div class="tier tier-1">
      <span class="tier-label">Chân ái của tớ:</span>
      <button type="button" class="tier-pick is-empty">Chọn món...</button>
      <span class="tier-note">Có cậu là đời tớ đủ rồi.</span>
      <svg class="deco" aria-hidden="true" width="72" height="72" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.5C.4 8 2.3 4 6 4c2.4 0 4.4 1.4 6 3.6C13.6 5.4 15.6 4 18 4c3.7 0 5.6 4 4 7.5C19.5 16.4 12 21 12 21z" fill="#FFFFFF" stroke="#5A2A41" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>

    <div class="tier tier-2">
      <span class="tier-label">Tạm được của tớ:</span>
      <button type="button" class="tier-pick is-empty">Chọn món...</button>
      <span class="tier-note">Không phải cậu kia thì… cậu vậy.</span>
    </div>

    <div class="tier tier-3">
      <span class="tier-label">Lốp dự phòng của tớ:</span>
      <button type="button" class="tier-pick is-empty">Chọn món...</button>
      <span class="tier-note">Cứ ở đó, lúc cần tớ gọi.</span>
      <svg class="deco" aria-hidden="true" width="62" height="62" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#5A2A41"/><circle cx="24" cy="24" r="10" fill="#FFFFFF" stroke="#5A2A41" stroke-width="2"/><circle cx="24" cy="24" r="3" fill="#5A2A41"/><path d="M24 4v5M24 39v5M4 24h5M39 24h5M10 10l3.5 3.5M34.5 34.5L38 38M38 10l-3.5 3.5M13.5 34.5L10 38" stroke="#FFD6E4" stroke-width="2" stroke-linecap="round"/></svg>
    </div>

    <div class="tier tier-4">
      <span class="tier-label">Miễn cưỡng lắm tớ mới uống:</span>
      <button type="button" class="tier-pick is-empty">Chọn món...</button>
      <span class="tier-note">Uống vì không còn ai.</span>
    </div>

    <p class="status" id="status" role="status"></p>
    <button type="button" class="clear" id="clearBtn">Xoá hết món của tớ</button>
  </div>

  <section>
    <h2>Mấy đứa kia viết gì:</h2>
    <div class="others" id="others"></div>
  </section>
</main>

<dialog id="whoDlg" class="dlg">
  <h2>Cậu là ai đấy?</h2>
  <div class="who-list" id="whoList"></div>
</dialog>

<dialog id="menuDlg" class="dlg dlg-menu">
  <form method="dialog"><button class="pill close">Đóng</button></form>
  <a href="menu.jpg" target="_blank" rel="noopener"><img src="menu.jpg" loading="lazy" alt="Menu chính của quán Lê La"></a>
  <a href="menu2.jpg" target="_blank" rel="noopener"><img src="menu2.jpg" loading="lazy" alt="Menu theo ngày của quán Lê La"></a>
  <p>Bấm vào ảnh để phóng to.</p>
</dialog>

<dialog id="pickDlg" class="dlg dlg-pick">
  <div class="pick-head">
    <h2>Chọn món</h2>
    <button type="button" class="pill" id="pickClose">Đóng</button>
  </div>
  <input id="pickSearch" class="pick-search" maxlength="60" placeholder="Tìm hoặc gõ tên món" aria-label="Tìm món" autocomplete="off">
  <button type="button" class="clear" id="pickClear" hidden>Bỏ món này</button>
  <div class="pick-list" id="pickList"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
